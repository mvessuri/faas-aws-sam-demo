AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FaaS demo - Lambda functions behind an HTTP API

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 128
    Timeout: 3

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Events:
        Hello:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: GET

  WorldClockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: clock.handler
      Environment:
        Variables:
          HOME_TIMEZONE: America/Argentina/Buenos_Aires
      Events:
        Time:
          Type: HttpApi
          Properties:
            Path: /time/{city}
            Method: GET

Outputs:
  HelloUrl:
    Description: Call this URL to invoke the function
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
  WorldClockUrl:
    Description: Replace tokyo with any supported city
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/time/tokyo"
